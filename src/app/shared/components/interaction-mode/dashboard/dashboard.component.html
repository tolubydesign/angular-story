<div data-component="dashboard" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%)">
  <mat-card class="story--board-container">
    <div class="mock-story-board">
      <div class="story-board--char-images">
        @for (image of loopingCount(2); track image) {
          <app-character-portrait class="character-image"> </app-character-portrait>
        }
      </div>

      <div class="story--text">
        <app-narrative class="story--text-container" [title]="title" [narrative]="narrative"> </app-narrative>
      </div>

      <!-- choices: reader choices -->
      <div class="story--choices--container">
        @for (choice of choices; track choice) {
          <button value="{{ choice.decision }}" (click)="makeChoice(choice.decision)" class="story-choice pointer">
            {{ choice.summary }}
          </button>
        }
      </div>
    </div>
  </mat-card>
</div>
